<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>제주지사 판매점 지도</title>
<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=7qlkzlucix"></script>
<style>
html,body,#map{width:100%;height:100%;margin:0;font-family:'Malgun Gothic',sans-serif}
#badge{position:fixed;z-index:10;left:10px;top:10px;background:white;padding:8px 11px;border-radius:9px;box-shadow:0 2px 8px #777;font-size:13px;cursor:pointer;user-select:none;-webkit-user-select:none}
#syncState{margin-left:5px;font-size:11px;color:#666}
.mk{background:#fff;border:2px solid #111;border-radius:6px;padding:3px 5px;font-weight:800;font-size:12px;white-space:nowrap;box-shadow:0 1px 4px #777;transform:translate(-50%,-100%);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.mk.done{background:#168844;color:#fff;border-color:#0e5c2d}
.mk.done::after{content:' 완료';font-size:10px}
.iw{padding:8px 10px;min-width:220px;font-size:13px;line-height:1.5}.iw b{font-size:15px}
.doneLine{margin-top:5px;color:#137a39;font-weight:700}
.navbtn{display:block;margin-top:8px;padding:9px 10px;border-radius:7px;background:#03c75a;color:white;text-decoration:none;text-align:center;font-weight:700;font-size:14px}
#completeModal{position:fixed;z-index:3000;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:18px}
#completeModal.show{display:flex}
.modalBox{width:min(360px,100%);background:#fff;border-radius:14px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.modalTitle{font-size:18px;font-weight:800;margin-bottom:8px}
.modalText{font-size:14px;line-height:1.55;color:#333;white-space:pre-line}
.modalActions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.modalActions button{flex:1;min-width:90px;min-height:44px;border:0;border-radius:9px;font-weight:800;font-size:14px}
#completeBtn{background:#168844;color:white}
#undoBtn{background:#d9534f;color:white}
#cancelBtn{background:#eee;color:#222}
#summaryModal{position:fixed;z-index:3100;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:14px}
#summaryModal.show{display:flex}
.summaryBox{width:min(520px,100%);max-height:82%;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.3);display:flex;flex-direction:column}
.summaryHead{padding:15px 16px 10px;font-size:18px;font-weight:800;border-bottom:1px solid #ddd}
.summaryBody{padding:12px 14px;overflow:auto;-webkit-overflow-scrolling:touch}
.summarySection{margin-bottom:16px}.summarySection:last-child{margin-bottom:0}
.summaryTitle{font-weight:800;font-size:15px;margin-bottom:7px}.summaryTitle.doneT{color:#137a39}.summaryTitle.todoT{color:#333}
.storeRow{display:block;width:100%;padding:9px;border:0;border-bottom:1px solid #eee;background:#fff;text-align:left;font-size:14px;line-height:1.35;color:#111}.storeRow:last-child{border-bottom:0}
.storeJump{cursor:pointer}.storeJump:active{background:#f2f2f2}
.storeCode{display:inline-block;min-width:54px;font-weight:800;margin-right:6px}
.summaryFoot{padding:10px 14px;border-top:1px solid #ddd;text-align:right}
#summaryClose{min-height:42px;padding:0 18px;border:0;border-radius:9px;background:#eee;font-weight:800}
</style>
</head>
<body>
<div id="badge"><div style="font-weight:800;margin-bottom:2px">제주지사 · 2026년 3분기 정기점검</div><b>28</b>개 판매점 · 완료 <b id="doneCount">0</b>곳 <span id="syncState">연결 준비중</span></div>
<div id="map"></div>
<div id="completeModal">
<div class="modalBox">
<div class="modalTitle" id="modalTitle"></div>
<div class="modalText" id="modalText"></div>
<div class="modalActions">
<button type="button" id="completeBtn">완료 처리</button>
<button type="button" id="undoBtn">완료 해제</button>
<button type="button" id="cancelBtn">취소</button>
</div></div></div>
<div id="summaryModal">
<div class="summaryBox">
<div class="summaryHead">제주지사 · 판매점 진행 현황 · 2026년 3분기 정기점검</div>
<div class="summaryBody" id="summaryBody"></div>
<div class="summaryFoot"><button type="button" id="summaryClose">닫기</button></div>
</div></div>
<script>
const d=[{"code":"41569","name":"네잎크로버복권방","address":"제주 서귀포시 고성오조로 9","lng":126.9133096,"lat":33.4447340},{"code":"23313","name":"해바라기 복권","address":"제주 서귀포시 고성오조로 73","lng":126.9143991,"lat":33.4502274},{"code":"26689","name":"동홍마트","address":"제주 서귀포시 남조로 27-1, 1층","lng":126.7203606,"lat":33.2823149},{"code":"40579","name":"오름슈퍼","address":"제주 서귀포시 대청로 39, 104호","lng":126.5040249,"lat":33.2527234},{"code":"41591","name":"멀티편의점","address":"제주 서귀포시 동홍로 46-5","lng":126.5679843,"lat":33.2526536},{"code":"21584","name":"동흥코사마트","address":"제주 서귀포시 동홍서로 108","lng":126.5696776,"lat":33.2586614},{"code":"41098","name":"대성식품","address":"제주 서귀포시 동홍중앙로7번길 24 1층(동홍동)","lng":126.5697355,"lat":33.2515873},{"code":"29280","name":"백경","address":"제주 서귀포시 서문로29번길 1","lng":126.5589574,"lat":33.2502979},{"code":"40716","name":"행운공간","address":"제주 서귀포시 안덕면 화순중앙로 94, 1층 1호","lng":126.3359361,"lat":33.2440055},{"code":"42623","name":"서귀포복권","address":"제주 서귀포시 일주동로 9217","lng":126.5082191,"lat":33.2489920},{"code":"18074","name":"왕대박찬스서귀포","address":"제주 서귀포시 중앙로 64","lng":126.5616134,"lat":33.2502445},{"code":"40811","name":"싱글벙글슈퍼","address":"제주 서귀포시 천지로 8 (서귀동)","lng":126.5610778,"lat":33.2482701},{"code":"19405","name":"돌하르방복권","address":"제주 서귀포시 태평로 353번길 9","lng":126.5599605,"lat":33.2469880},{"code":"18783","name":"서귀포송산점","address":"제주 서귀포시 태평로 414","lng":126.5645517,"lat":33.2446536},{"code":"40717","name":"워드디자인","address":"제주 서귀포시 태평로 541(동흥동)","lng":126.5746123,"lat":33.2523314},{"code":"17531","name":"왕대박복권방","address":"제주 서귀포시 표선면 표선관정로 103","lng":126.8311738,"lat":33.3240061},{"code":"42624","name":"승승로또복권","address":"제주 제주시 과원로 47-1","lng":126.4884340,"lat":33.4765192},{"code":"42625","name":"세화텔레콤","address":"제주 제주시 구좌읍 구좌로 42-2","lng":126.8560575,"lat":33.5232349},{"code":"18762","name":"빙고복권방","address":"제주 제주시 남녕로 36 102호(연동,영진그린빌라)","lng":126.4808581,"lat":33.4909068},{"code":"40137","name":"온누리","address":"제주 제주시 남성로 86, 1층(용담일동)","lng":126.5153675,"lat":33.5072663},{"code":"23385","name":"7SEVEN BET","address":"제주 제주시 노연로 55","lng":126.4860767,"lat":33.4861627},{"code":"27110","name":"드림상사","address":"제주 제주시 도남로8길 2(도남동)","lng":126.5271511,"lat":33.4950049},{"code":"21382","name":"사거리마트","address":"제주 제주시 동광로 114, 1층 101호","lng":126.5394743,"lat":33.5063739},{"code":"26463","name":"세븐","address":"제주 제주시 동광로 150","lng":126.5421915,"lat":33.5085160},{"code":"16947","name":"화북주공점","address":"제주 제주시 동화로 7","lng":126.5731214,"lat":33.5194017},{"code":"24689","name":"조향수퍼","address":"제주 제주시 사장2길 39","lng":126.4913776,"lat":33.4841161},{"code":"40253","name":"삼화유통","address":"제주 제주시 삼무로 62 , 1층(연동)","lng":126.4931936,"lat":33.4896088},{"code":"20836","name":"터미널담배","address":"제주 제주시 서광로 174","lng":126.5147250,"lat":33.4997260}];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
window.dealerMapState={data:d,statuses:{},opened:null,selectedCode:null,markers:{},infoWindows:{},firebaseReady:false,branchCode:'jeju',branchName:'제주지사',workKey:'work_20260824_190256',workName:'2026년 3분기 정기점검',completionPath:'completedStores/branches/jeju/tasks/work_20260824_190256'};
const S=window.dealerMapState;
function navUrl(x){
return 'nmap://navigation?dlat='+encodeURIComponent(x.lat)+'&dlng='+encodeURIComponent(x.lng)+'&dname='+encodeURIComponent(x.code+' '+x.name)+'&appname=https%3A%2F%2Fcoca1440.github.io';
}
function infoHtml(x){
const st=S.statuses[x.code];
const done=!!(st&&st.done===true);
let doneLine='';
if(done){doneLine='<div class="doneLine">완료';if(st.by)doneLine+=' · '+esc(st.by);doneLine+='</div>';}
return '<div class="iw"><b>'+esc(x.code)+' · '+esc(x.name)+'</b><br>'+esc(x.address)+doneLine+'<a class="navbtn" href="'+navUrl(x)+'" target="_blank" rel="noopener">네이버지도 길찾기</a></div>';
}
const m=new naver.maps.Map('map',{center:new naver.maps.LatLng(d[0].lat,d[0].lng),zoom:14});
S.map=m;
const b=new naver.maps.LatLngBounds();
d.forEach(x=>{
const p=new naver.maps.LatLng(x.lat,x.lng);b.extend(p);
const content='<div class="mk" data-code="'+esc(x.code)+'">'+esc(x.code)+'</div>';
const mk=new naver.maps.Marker({map:m,position:p,icon:{content:content,anchor:new naver.maps.Point(0,0)}});
const iw=new naver.maps.InfoWindow({content:'',borderWidth:0,pixelOffset:new naver.maps.Point(0,-12)});
S.markers[x.code]=mk;S.infoWindows[x.code]=iw;
naver.maps.Event.addListener(mk,'click',()=>{
if(S.suppressClickCode===x.code){S.suppressClickCode=null;return;}
if(S.opened)S.opened.close();
iw.setContent(infoHtml(x));iw.open(m,mk);S.opened=iw;
});
});
if(d.length>1)m.fitBounds(b);else m.setZoom(16);
window.applyDealerStatuses=function(){
let done=0;
document.querySelectorAll('.mk[data-code]').forEach(el=>{
const st=S.statuses[el.dataset.code];
const isDone=!!(st&&st.done===true);
el.classList.toggle('done',isDone);
if(isDone)done++;
});
document.getElementById('doneCount').textContent=done;
if(S.selectedCode&&window.refreshDealerModal)window.refreshDealerModal();
if(document.getElementById('summaryModal').classList.contains('show'))document.getElementById('summaryBody').innerHTML=summaryHtml();
};
naver.maps.Event.addListener(m,'click',()=>{
if(S.opened){S.opened.close();S.opened=null;}
});
</script>
<script type="module">
const S=window.dealerMapState;
const syncState=document.getElementById('syncState');
try{
const [{initializeApp},{getAuth,signInAnonymously},{getDatabase,ref,onValue,set,remove,serverTimestamp}]=await Promise.all([
import('https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js'),
import('https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js'),
import('https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js')
]);
const firebaseConfig={
apiKey:'AIzaSyB9GCflO2QIwOMaPLZLkVCDq4gme8R-A4Q',
authDomain:'dealer-map-status.firebaseapp.com',
databaseURL:'https://dealer-map-status-default-rtdb.asia-southeast1.firebasedatabase.app',
projectId:'dealer-map-status',
appId:'1:967752424466:web:3464de3190a41f1b7c0ccb'
};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);
await signInAnonymously(auth);
S.firebaseReady=true;S.db=db;S.fb={ref,onValue,set,remove,serverTimestamp};
syncState.textContent='실시간 연결됨';
syncState.style.color='#168844';
onValue(ref(db,S.completionPath),snap=>{
S.statuses=snap.val()||{};
window.applyDealerStatuses();
});
}catch(err){
console.error('Firebase 연결 오류',err);
syncState.textContent='실시간 연결 실패';
syncState.style.color='#c0392b';
}
const byCode=Object.fromEntries(S.data.map(x=>[x.code,x]));
const modal=document.getElementById('completeModal');
const modalTitle=document.getElementById('modalTitle');
const modalText=document.getElementById('modalText');
const completeBtn=document.getElementById('completeBtn');
const undoBtn=document.getElementById('undoBtn');
const cancelBtn=document.getElementById('cancelBtn');
const badge=document.getElementById('badge');
const summaryModal=document.getElementById('summaryModal');
const summaryBody=document.getElementById('summaryBody');
const summaryClose=document.getElementById('summaryClose');
window.refreshDealerModal=function(){
const x=byCode[S.selectedCode];if(!x)return;
const st=S.statuses[S.selectedCode];
const done=!!(st&&st.done===true);
modalTitle.textContent=x.code+' · '+x.name;
let t=x.address+'\\n\\n현재 상태: '+(done?'완료':'미완료');
if(done&&st.by)t+='\\n완료자: '+st.by;
if(!S.firebaseReady)t+='\\n\\n※ 실시간 서버에 연결되지 않았습니다.';
modalText.textContent=t;
completeBtn.style.display=done?'none':'block';
undoBtn.style.display=done?'block':'none';
completeBtn.disabled=!S.firebaseReady;
undoBtn.disabled=!S.firebaseReady;
};
function openModal(code){S.selectedCode=code;window.refreshDealerModal();modal.classList.add('show');}
function closeModal(){modal.classList.remove('show');S.selectedCode=null;clearTextSelection();}
function summaryHtml(){
const doneList=[],todoList=[];
S.data.forEach(x=>{const st=S.statuses[x.code];(st&&st.done===true?doneList:todoList).push(x);});
doneList.sort((a,b)=>a.code.localeCompare(b.code));todoList.sort((a,b)=>a.code.localeCompare(b.code));
const rows=list=>list.length?list.map(x=>'<button type="button" class="storeRow storeJump" data-code="'+esc(x.code)+'"><span class="storeCode">'+esc(x.code)+'</span>'+esc(x.name)+'</button>').join(''):'<div class="storeRow">없음</div>';
return '<div class="summarySection"><div class="summaryTitle doneT">완료 '+doneList.length+'곳</div>'+rows(doneList)+'</div><div class="summarySection"><div class="summaryTitle todoT">미완료 '+todoList.length+'곳</div>'+rows(todoList)+'</div>';
}
function openSummary(){summaryBody.innerHTML=summaryHtml();summaryModal.classList.add('show');clearTextSelection();}
function closeSummary(){summaryModal.classList.remove('show');clearTextSelection();}
function jumpToStore(code){
const x=byCode[code];const mk=S.markers[code];const iw=S.infoWindows[code];
if(!x||!mk||!iw)return;
closeSummary();
if(S.opened)S.opened.close();
const pos=mk.getPosition();
S.map.setCenter(pos);
if(S.map.getZoom()<17)S.map.setZoom(17);
setTimeout(()=>{iw.setContent(infoHtml(x));iw.open(S.map,mk);S.opened=iw;},180);
}
function getWorkerName(){
let n=localStorage.getItem('dealerWorkerName')||'';
if(!n){n=(prompt('완료 처리할 직원 이름을 입력하세요.')||'').trim();if(n)localStorage.setItem('dealerWorkerName',n);}
return n;
}
completeBtn.addEventListener('click',async()=>{
if(!S.firebaseReady||!S.selectedCode)return;
const by=getWorkerName();if(!by)return;
const f=S.fb;
await f.set(f.ref(S.db,S.completionPath+'/'+S.selectedCode),{done:true,by:by,updatedAt:f.serverTimestamp(),workName:S.workName});
closeModal();
});
undoBtn.addEventListener('click',async()=>{
if(!S.firebaseReady||!S.selectedCode)return;
if(!confirm('이 판매점의 완료 표시를 해제하시겠습니까?'))return;
const f=S.fb;
await f.remove(f.ref(S.db,S.completionPath+'/'+S.selectedCode));
closeModal();
});
cancelBtn.addEventListener('click',closeModal);
modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});
badge.addEventListener('click',e=>{e.stopPropagation();openSummary();});
summaryClose.addEventListener('click',closeSummary);
summaryBody.addEventListener('click',e=>{const row=e.target.closest?e.target.closest('.storeJump[data-code]'):null;if(row)jumpToStore(row.dataset.code);});
summaryModal.addEventListener('click',e=>{if(e.target===summaryModal)closeSummary();});
const mapEl=document.getElementById('map');
let holdTimer=null,holdStartX=0,holdStartY=0;
function clearTextSelection(){try{const s=window.getSelection();if(s&&s.removeAllRanges)s.removeAllRanges();}catch(e){}}
mapEl.addEventListener('selectstart',e=>{const el=e.target.closest?e.target.closest('.mk[data-code]'):null;if(el)e.preventDefault();},true);
mapEl.addEventListener('dragstart',e=>{const el=e.target.closest?e.target.closest('.mk[data-code]'):null;if(el)e.preventDefault();},true);
mapEl.addEventListener('pointerdown',e=>{
const el=e.target.closest?e.target.closest('.mk[data-code]'):null;if(!el)return;
clearTextSelection();
holdStartX=e.clientX;holdStartY=e.clientY;clearTimeout(holdTimer);
const code=el.dataset.code;
holdTimer=setTimeout(()=>{clearTextSelection();S.suppressClickCode=code;openModal(code);setTimeout(clearTextSelection,50);},700);
},true);
mapEl.addEventListener('pointermove',e=>{
if(!holdTimer)return;const dx=e.clientX-holdStartX,dy=e.clientY-holdStartY;
if(Math.sqrt(dx*dx+dy*dy)>12){clearTimeout(holdTimer);holdTimer=null;}
},true);
mapEl.addEventListener('pointerup',()=>{clearTimeout(holdTimer);holdTimer=null;},true);
mapEl.addEventListener('pointercancel',()=>{clearTimeout(holdTimer);holdTimer=null;},true);
mapEl.addEventListener('contextmenu',e=>{
const el=e.target.closest?e.target.closest('.mk[data-code]'):null;if(!el)return;
e.preventDefault();openModal(el.dataset.code);
},true);
</script>
</body>
</html>
