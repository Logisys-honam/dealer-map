const a=newPw1.value,b=newPw2.value;pwMsg.textContent='';
if(a.length<6){pwMsg.textContent='비밀번호는 6자 이상이어야 합니다.';return;}if(a!==b){pwMsg.textContent='비밀번호 확인이 일치하지 않습니다.';return;}
try{await updatePassword(auth.currentUser,a);pwModal.classList.remove('show');alert('비밀번호가 변경되었습니다.');}catch(err){console.error(err);pwMsg.textContent=String(err.code||'').includes('requires-recent-login')?'보안을 위해 로그아웃 후 다시 로그인한 다음 변경해 주세요.':'비밀번호 변경 중 오류가 발생했습니다.';}
});
}catch(err){
console.error('Firebase 초기화 오류',err);loginMsg.textContent='로그인 시스템을 불러오지 못했습니다.';syncState.textContent='연결 실패';syncState.style.color='#c0392b';
}
const byCode=Object.fromEntries(S.data.map(x=>[x.code,x]));
const modal=document.getElementById('completeModal');
const modalTitle=document.getElementById('modalTitle');
const modalText=document.getElementById('modalText');
const completeBtn=document.getElementById('completeBtn');
const undoBtn=document.getElementById('undoBtn');
const cancelBtn=document.getElementById('cancelBtn');
const badge=document.getElementById('badge');
const summaryModal=document.getElementById('summaryModal');
const summaryBody=document.getElementById('summaryBody');
const summaryClose=document.getElementById('summaryClose');
window.refreshDealerModal=function(){
const x=byCode[S.selectedCode];if(!x)return;
const st=S.statuses[S.selectedCode];
const done=!!(st&&st.done===true);
modalTitle.textContent=x.code+' · '+x.name;
let t=x.address+'\\n\\n현재 상태: '+(done?'완료':'미완료');
if(done&&st.by)t+='\\n완료자: '+st.by;
if(!S.firebaseReady)t+='\\n\\n※ 실시간 서버에 연결되지 않았습니다.';
modalText.textContent=t;
completeBtn.style.display=done?'none':'block';
undoBtn.style.display=done?'block':'none';
completeBtn.disabled=!S.firebaseReady;
undoBtn.disabled=!S.firebaseReady;
};
function openModal(code){S.selectedCode=code;window.refreshDealerModal();modal.classList.add('show');}
function closeModal(){modal.classList.remove('show');S.selectedCode=null;clearTextSelection();}
function summaryHtml(){
const doneList=[],todoList=[];
S.data.forEach(x=>{const st=S.statuses[x.code];(st&&st.done===true?doneList:todoList).push(x);});
doneList.sort((a,b)=>a.code.localeCompare(b.code));todoList.sort((a,b)=>a.code.localeCompare(b.code));
const rows=list=>list.length?list.map(x=>'<button type="button" class="storeRow storeJump" data-code="'+esc(x.code)+'"><span class="storeCode">'+esc(x.code)+'</span>'+esc(x.name)+'</button>').join(''):'<div class="storeRow">없음</div>';
return '<div class="summarySection"><div class="summaryTitle doneT">완료 '+doneList.length+'곳</div>'+rows(doneList)+'</div><div class="summarySection"><div class="summaryTitle todoT">미완료 '+todoList.length+'곳</div>'+rows(todoList)+'</div>';
}
function openSummary(){summaryBody.innerHTML=summaryHtml();summaryModal.classList.add('show');clearTextSelection();}
function closeSummary(){summaryModal.classList.remove('show');clearTextSelection();}
function jumpToStore(code){
const x=byCode[code];const mk=S.markers[code];const iw=S.infoWindows[code];
if(!x||!mk||!iw)return;
closeSummary();
if(S.opened)S.opened.close();
const pos=mk.getPosition();
S.map.setCenter(pos);
if(S.map.getZoom()<17)S.map.setZoom(17);
setTimeout(()=>{iw.setContent(infoHtml(x));iw.open(S.map,mk);S.opened=iw;},180);
}
function getWorkerName(){
let n=localStorage.getItem('dealerWorkerName')||'';
if(!n){n=(prompt('완료 처리할 직원 이름을 입력하세요.')||'').trim();if(n)localStorage.setItem('dealerWorkerName',n);}
return n;
}
completeBtn.addEventListener('click',async()=>{
if(!S.firebaseReady||!S.selectedCode)return;
const by=getWorkerName();if(!by)return;
const f=S.fb;
await f.set(f.ref(S.db,S.completionPath+'/'+S.selectedCode),{done:true,by:by,updatedAt:f.serverTimestamp(),workName:S.workName});
closeModal();
});
undoBtn.addEventListener('click',async()=>{
if(!S.firebaseReady||!S.selectedCode)return;
if(!confirm('이 판매점의 완료 표시를 해제하시겠습니까?'))return;
const f=S.fb;
await f.remove(f.ref(S.db,S.completionPath+'/'+S.selectedCode));
closeModal();
});
cancelBtn.addEventListener('click',closeModal);
modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});
badge.addEventListener('click',e=>{e.stopPropagation();openSummary();});
summaryClose.addEventListener('click',closeSummary);
summaryBody.addEventListener('click',e=>{const row=e.target.closest?e.target.closest('.storeJump[data-code]'):null;if(row)jumpToStore(row.dataset.code);});
summaryModal.addEventListener('click',e=>{if(e.target===summaryModal)closeSummary();});
const mapEl=document.getElementById('map');
let holdTimer=null,holdStartX=0,holdStartY=0;
function clearTextSelection(){try{const s=window.getSelection();if(s&&s.removeAllRanges)s.removeAllRanges();}catch(e){}}
mapEl.addEventListener('selectstart',e=>{const el=e.target.closest?e.target.closest('.mk[data-code]'):null;if(el)e.preventDefault();},true);
mapEl.addEventListener('dragstart',e=>{const el=e.target.closest?e.target.closest('.mk[data-code]'):null;if(el)e.preventDefault();},true);
mapEl.addEventListener('pointerdown',e=>{
const el=e.target.closest?e.target.closest('.mk[data-code]'):null;if(!el)return;
clearTextSelection();
holdStartX=e.clientX;holdStartY=e.clientY;clearTimeout(holdTimer);
const code=el.dataset.code;
holdTimer=setTimeout(()=>{clearTextSelection();S.suppressClickCode=code;openModal(code);setTimeout(clearTextSelection,50);},700);
},true);
mapEl.addEventListener('pointermove',e=>{
if(!holdTimer)return;const dx=e.clientX-holdStartX,dy=e.clientY-holdStartY;
if(Math.sqrt(dx*dx+dy*dy)>12){clearTimeout(holdTimer);holdTimer=null;}
},true);
mapEl.addEventListener('pointerup',()=>{clearTimeout(holdTimer);holdTimer=null;},true);
mapEl.addEventListener('pointercancel',()=>{clearTimeout(holdTimer);holdTimer=null;},true);
mapEl.addEventListener('contextmenu',e=>{
const el=e.target.closest?e.target.closest('.mk[data-code]'):null;if(!el)return;
e.preventDefault();openModal(el.dataset.code);
},true);
</script>
</body>
</html>
